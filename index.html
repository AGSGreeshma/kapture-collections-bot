<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya - Kapture Collections</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 420px;
            padding: 45px 35px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #111827;
            font-size: 40px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="avatar">🎙️</div>

    <h1>Maya</h1>

    <p>
        Kapture Collections<br>
        Voice Assistant
    </p>

</div>

<!-- Vapi Voice Widget -->
<script
    src="https://unpkg.com/@vapi-ai/client-sdk-react/dist/embed/widget.umd.js"
    async
    type="text/javascript">
</script>

<vapi-widget
    public-key="1202de7b-d7f2-4ab5-af54-de453c83bd5a"
    assistant-id="09e5bc40-1ecb-41df-b2ff-aa255a6e36c3"
    mode="voice"
    size="compact"
    theme="light"
    main-label="Talk to Maya"
    start-button-text="Talk to Maya"

</html>
